version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0 # no version updates, only security
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
  - package-ecosystem: github-actions
    directories:
      - / # the workflows
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        group-by: dependency-name # one PR for each action, not one for each directory that uses it
    commit-message:
      prefix: ci
