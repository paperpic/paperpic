name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read # check out the repo

env:
  HUSKY: 0

# A push to a PR cancels the run it replaces. Runs on development and main always finish
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node --input-type=module >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import { readFileSync } from 'node:fs'
          const { total } = JSON.parse(readFileSync('coverage/coverage-summary.json', 'utf8'))
          const rows = ['statements', 'branches', 'functions', 'lines']
            .map(key => `| ${key[0].toUpperCase()}${key.slice(1)} | ${total[key].pct}% | ${total[key].covered} / ${total[key].total} |`)
          console.log(['## Coverage', '', '| Metric | % | Covered |', '| --- | --- | --- |', ...rows].join('\n'))
          EOF

  # The docs use the source of the packages, so they build without them
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter docs build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./packages/*" build
      # The smoke tests run the playground against the packages that the build just wrote.
      # The image brings the browsers and their system packages: installing them with apt hung on slow mirrors
      - name: Smoke tests
        run: |
          version=$(node -p "require('./playgrounds/vanilla/package.json').devDependencies['@playwright/test']")
          node_dir=$(dirname "$(dirname "$(command -v node)")")
          docker run --rm --init --ipc=host \
            --env CI \
            --env "PATH=$PWD/playgrounds/vanilla/node_modules/.bin:$node_dir/bin:/usr/bin:/bin" \
            --volume "$PWD:$PWD" \
            --volume "$node_dir:$node_dir:ro" \
            --workdir "$PWD/playgrounds/vanilla" \
            "mcr.microsoft.com/playwright:v$version-noble" playwright test
      - name: Upload the Playwright report
        if: ${{ failure() && hashFiles('playgrounds/vanilla/playwright-report/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playgrounds/vanilla/playwright-report
          retention-days: 7

  # The only check of this workflow that the rulesets require: a job missing from `needs` cannot block a merge.
  # It runs whatever the others do, because GitHub takes a skipped check as passed
  ci:
    name: ci
    if: ${{ always() }}
    needs: [lint, typecheck, test, docs, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          [[ $RESULTS =~ ^success( success)*$ ]]
