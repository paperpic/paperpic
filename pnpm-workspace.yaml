# Only install versions published at least 24h ago (in minutes)
minimumReleaseAge: 1440

# Fall back to a newer version when no version meets minimumReleaseAge
minimumReleaseAgeStrict: false

# Drop minimumReleaseAgeExclude entries the lockfile no longer resolves
minimumReleaseAgeExcludePrune: true

# Fail if a package's trust level drops compared to previous releases
trustPolicy: no-downgrade

# Run scripts with pnpm's cross-platform bash-like shell
shellEmulator: true

# Refuse dependencies whose engines field excludes the current Node version
engineStrict: true

# Save exact versions, without ^
savePrefix: ''

packages:
  - packages/*
  - apps/*
  - playgrounds/*

# Force patched versions of vulnerable transitive dependencies
overrides:
  # js-beautify 2, through @vue/test-utils, asks for versions without the fixes (GHSA-g3hv-75wg-m249, GHSA-3g3m-2fjr-6pw4)
  editorconfig>minimatch: 11.0.8
  js-beautify>glob: 14.0.6
  # micromark-extension-math, through @antfu/eslint-config, asks for 0.16 (GHSA-238p-pmpm-9mq7)
  micromark-extension-math>katex: 0.18.10
  # oxfmt 0.35 pins 2.1.0 (GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr)
  tinypool: 2.2.0
  # vitepress 1 asks for vite 5, which does not have the fixes of 6.4.4; drop with VitePress 2
  vitepress>vite: 6.4.6

# Packages allowed (true) or denied (false) to run install scripts
allowBuilds:
  esbuild: false

# What dependencies may do beyond installing: tsdown links its agent skill
permissions:
  tsdown:
    skills: true

# Where pnpm links skills from dependencies: .claude for Claude Code, .agents for Codex and other agents
skills:
  dirs:
    - .agents/skills
    - .claude/skills
