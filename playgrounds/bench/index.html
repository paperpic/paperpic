<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <title>PaperPic benchmarks</title>
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 16px;
        color: #222;
      }

      label {
        display: block;
        margin-block: 8px;
      }

      input[type='text'] {
        inline-size: min(100%, 640px);
      }

      button {
        font: inherit;
        padding: 8px 16px;
        margin-inline-end: 8px;
      }

      table {
        border-collapse: collapse;
        margin-block: 12px;
      }

      th,
      td {
        border: 1px solid #bbb;
        padding: 2px 8px;
        text-align: start;
      }

      td.failed {
        background: #fdd;
      }

      #log {
        font-weight: 600;
      }

      #json {
        inline-size: 100%;
        block-size: 96px;
      }

      #previews {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: flex-start;
      }

      figure {
        margin: 0;
      }

      figcaption {
        font-size: 12px;
      }

      canvas {
        display: block;
        border: 1px solid #bbb;
      }
    </style>
  </head>
  <body>
    <h1>PaperPic benchmarks</h1>
    <p>Development only. Photos stay in this browser: nothing is uploaded or saved.</p>
    <label>Photo <input id="file" type="file" accept="image/*" /></label>
    <label>
      Corners for the warp, as fractions of the image, in order: top left, top right, bottom right, bottom left. The
      default is a plain rectangle, which only crops: use the corners of the document to correct perspective.
      <input id="corners" type="text" value="0.1,0.1, 0.9,0.1, 0.9,0.9, 0.1,0.9" />
    </label>
    <label>Aspect ratio as width/height, such as 80/204. Empty to estimate it <input id="aspect" type="text" /></label>
    <label>Sizes in megapixels, or "full" <input id="sizes" type="text" value="2,12,full" /></label>
    <label>Runs per measurement <input id="runs" type="number" value="3" min="1" max="10" /></label>
    <label
      >Threshold sensitivity for the visual results
      <input id="sensitivity" type="number" value="0.5" min="0" max="1" step="0.05"
    /></label>
    <button id="run" type="button">Run benchmarks</button>
    <button id="visual" type="button">Show visual results</button>
    <button id="painting" type="button">Compare painting</button>
    <button id="copy" type="button">Copy results</button>
    <p id="log" role="status" aria-live="polite">Choose a photo.</p>
    <table id="results"></table>
    <label>Results <textarea id="json" readonly></textarea></label>
    <div id="previews"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
